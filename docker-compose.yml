services:
  db:
    image: mysql:8.0
    container_name: cgv-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1(TCP)로 확인: 초기화 중 임시 서버(소켓 전용)에는 성공하지 않도록 함
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - cgv-net

  redis:
    image: redis:7-alpine
    container_name: cgv-redis
    # 캐시 전용이라 디스크에 저장하지 않는다 (재시작하면 캐시는 비워지고 DB에서 다시 채워짐)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cgv-net

  backend:
    build: .
    container_name: cgv-backend
    ports:
      - "8080:8080"
      # 관리 포트(Actuator)는 로컬에서만 접근 가능하도록 바인딩. Prometheus는 compose 네트워크로 직접 수집
      - "127.0.0.1:8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      TOSS_WEBHOOK_SECRET: ${TOSS_WEBHOOK_SECRET}
    volumes:
      # 컨테이너를 지워도 로그 파일이 남도록 호스트 폴더에 연결
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cgv-net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: cgv-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 로컬 모니터링 용도이므로 2일만 보관
      - --storage.tsdb.retention.time=2d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    networks:
      - cgv-net

  grafana:
    image: grafana/grafana:11.6.0
    container_name: cgv-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # 3000번은 프론트엔드 개발 서버가 자주 쓰므로 3001로 연결
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cgv-net

volumes:
  db-data:
  prometheus-data:
  grafana-data:

networks:
  cgv-net:
    driver: bridge