# 로컬에서 앱 + MySQL을 한 번에 띄운다. 비밀값은 Git에 올리지 않는 .env를 그대로 재사용한다.
# 실행: docker compose up -d --build / 종료: docker compose down (데이터까지 지우려면 -v)
services:
  db:
    image: mysql:8.0
    environment:
      # 로컬 .env는 root 계정을 쓴다. MYSQL_USER에 root를 넣으면 이미지가 거부하므로 root 비밀번호만 맞춘다.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    # 호스트에 이미 로컬 MySQL(3306)이 떠 있을 수 있어 겹치지 않는 포트로 연다. 앱은 내부 네트워크로 접속한다.
    ports:
      - "3307:3306"
    # 컨테이너가 떠도 MySQL은 초기화에 수십 초가 걸린다. 접속을 받을 때까지 앱 시작을 미룬다.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: cgv:local
    env_file: .env
    environment:
      # 컨테이너 안의 localhost는 앱 자신이다. compose 네트워크에서는 서비스 이름으로 DB를 찾는다.
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # 로컬 모니터링. 운영 EC2에는 띄우지 않는다(메모리 여유가 없고 메트릭 엔드포인트도 열지 않는다).
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # 로컬 전용 기본값. 바꾸려면 .env에 GRAFANA_ADMIN_PASSWORD를 둔다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # 앱이 쓰는 3000(프런트 개발 서버 기본 포트, CORS 기본 허용 출처)과 겹치지 않게 연다.
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  db-data:
  prometheus-data:
