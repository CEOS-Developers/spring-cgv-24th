<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 800 460" width="800" height="460" role="img" aria-label="재고 3, 판매 가능 2에 2개씩 승인 두 건. 잠금이 없으면 두 승인이 모두 재고 3을 읽고 게이트를 함께 통과해 둘 다 1을 저장한다. FOR UPDATE가 있으면 늦은 승인이 앞선 승인의 커밋까지 막혀 재고 1을 읽고 품절로 끝난다." color="#586375">
  <title>게이트로 경합 순서를 고정한다</title>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 12px; fill: #17202c; }
    .h { font-size: 13px; font-weight: 700; }
    .sm { font-size: 11px; }
    .muted { fill: #586375; }
    .mono { font-family: Consolas, "D2Coding", "Malgun Gothic", monospace; font-size: 11.5px; }
    .bad { fill: #b42318; font-weight: 700; }
    .ok { fill: #1d7436; font-weight: 700; }
    .lock-t { fill: #a85208; }
    .box { fill: #ffffff; stroke: #17202c; stroke-width: 1; }
    .box-bad { fill: #ffffff; stroke: #b42318; stroke-width: 1.5; }
    .lock { fill: #fbe8d2; stroke: #a85208; stroke-width: 1; }
    .lock-line { stroke: #a85208; stroke-width: 3; }
    .state { fill: #d3efea; stroke: #0d6f67; stroke-width: 1; }
    .ghost { fill: none; stroke: #586375; stroke-width: 1; stroke-dasharray: 4 3; }
    .gate { fill: #17202c; }
    .gate-line { stroke: #17202c; stroke-width: 1; stroke-dasharray: 3 3; }
    .axis { stroke: #586375; stroke-width: 1; }
    .rule { stroke: #d6dce5; stroke-width: 1; }
    .arrival { stroke: #17202c; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .dot-ok { fill: #0d6f67; }
    .dot-bad { fill: #b42318; }
  </style>
  <rect x="-20" y="-20" width="800" height="460" fill="#ffffff"/>
          <defs>
            <marker id="g1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
            </marker>
          </defs>

          <!-- 적용 전 -->
          <text class="h" x="0" y="18">적용 전 · 잠금 없는 SELECT</text>
          <text class="sm muted" x="285" y="44" text-anchor="middle">게이트 · 둘 다 도착해 함께 통과</text>
          <line class="gate-line" x1="285" y1="50" x2="285" y2="136"/>

          <text x="0" y="72">승인 A</text>
          <rect class="box-bad" x="80" y="52" width="190" height="32" rx="4"/>
          <text class="mono" x="175" y="72" text-anchor="middle">SELECT 재고 → 3</text>
          <polygon class="gate" points="285,60 293,68 285,76 277,68"/>
          <rect class="box" x="300" y="52" width="150" height="32" rx="4"/>
          <text x="375" y="72" text-anchor="middle">차감 3 − 2 = 1</text>
          <rect class="box" x="460" y="52" width="150" height="32" rx="4"/>
          <text class="mono" x="535" y="72" text-anchor="middle">UPDATE 1 · COMMIT</text>

          <text x="0" y="120">승인 B</text>
          <rect class="box-bad" x="80" y="100" width="190" height="32" rx="4"/>
          <text class="mono" x="175" y="120" text-anchor="middle">SELECT 재고 → 3</text>
          <polygon class="gate" points="285,108 293,116 285,124 277,116"/>
          <rect class="box" x="300" y="100" width="150" height="32" rx="4"/>
          <text x="375" y="120" text-anchor="middle">차감 3 − 2 = 1</text>
          <rect class="lock" x="460" y="100" width="130" height="32" rx="4"/>
          <text x="525" y="120" text-anchor="middle">A의 행 락 대기</text>
          <rect class="box" x="600" y="100" width="150" height="32" rx="4"/>
          <text class="mono" x="675" y="120" text-anchor="middle">UPDATE 1 · COMMIT</text>

          <text class="bad" x="80" y="160">결과 · 두 건 모두 성공, 4개 판매 · 재고 3 → 1 (2만 줄어듦)</text>
          <line class="axis" x1="80" y1="176" x2="748" y2="176" marker-end="url(#g1-arrow)"/>
          <text class="sm muted" x="748" y="169" text-anchor="end">시간</text>

          <line class="rule" x1="0" y1="198" x2="760" y2="198"/>

          <!-- 적용 후 -->
          <text class="h" x="0" y="228">적용 후 · SELECT … FOR UPDATE</text>
          <text class="sm muted" x="285" y="254" text-anchor="middle">A만 도착 · 1초 뒤 혼자 통과</text>

          <text x="0" y="282">승인 A</text>
          <rect class="box" x="80" y="262" width="190" height="32" rx="4"/>
          <text class="mono" x="175" y="282" text-anchor="middle">FOR UPDATE → 3</text>
          <polygon class="gate" points="285,270 293,278 285,286 277,278"/>
          <rect class="ghost" x="300" y="262" width="140" height="32" rx="4"/>
          <text class="muted" x="370" y="282" text-anchor="middle">상대 대기 1초</text>
          <rect class="box" x="450" y="262" width="150" height="32" rx="4"/>
          <text x="525" y="282" text-anchor="middle">차감 → 1 · COMMIT</text>
          <line class="lock-line" x1="80" y1="304" x2="600" y2="304"/>
          <text class="sm lock-t" x="608" y="308">A가 쥔 재고 행 락</text>

          <text x="0" y="338">승인 B</text>
          <rect class="lock" x="80" y="318" width="520" height="32" rx="4"/>
          <text x="340" y="338" text-anchor="middle">FOR UPDATE · A가 커밋할 때까지 대기</text>
          <polygon class="gate" points="615,326 623,334 615,342 607,334"/>
          <rect class="box" x="630" y="318" width="120" height="32" rx="4"/>
          <text x="690" y="338" text-anchor="middle">1 읽음 → 품절</text>
          <text class="sm muted" x="615" y="368" text-anchor="middle">열린 게이트 · 바로 통과</text>

          <text class="ok" x="80" y="392">결과 · 1건 성공 + 1건 OUT_OF_STOCK · 재고 3 → 1</text>
          <line class="axis" x1="80" y1="408" x2="748" y2="408" marker-end="url(#g1-arrow)"/>
          <text class="sm muted" x="748" y="401" text-anchor="end">시간</text>
        </svg>
