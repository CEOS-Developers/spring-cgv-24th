<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 800 400" width="800" height="400" role="img" aria-label="승인 A의 T1, 토스 호출, T2 위에 세 가지 구성을 겹쳐 그림. 지금은 락이 T1만 덮고 IN_PROGRESS가 토스 호출 구간을 덮어, 토스 대기 중 도착한 B가 즉시 409로 끝난다. 확인을 빼면 B가 토스를 한 번 더 부른다. 한 트랜잭션으로 묶으면 락이 토스 응답까지 이어져 B가 3초 뒤 락 대기 예외로 끝난다." color="#586375">
  <title>락과 승인 중 상태가 덮는 구간</title>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 12px; fill: #17202c; }
    .h { font-size: 13px; font-weight: 700; }
    .sm { font-size: 11px; }
    .muted { fill: #586375; }
    .mono { font-family: Consolas, "D2Coding", "Malgun Gothic", monospace; font-size: 11.5px; }
    .bad { fill: #b42318; font-weight: 700; }
    .ok { fill: #1d7436; font-weight: 700; }
    .lock-t { fill: #a85208; }
    .box { fill: #ffffff; stroke: #17202c; stroke-width: 1; }
    .box-bad { fill: #ffffff; stroke: #b42318; stroke-width: 1.5; }
    .lock { fill: #fbe8d2; stroke: #a85208; stroke-width: 1; }
    .lock-line { stroke: #a85208; stroke-width: 3; }
    .state { fill: #d3efea; stroke: #0d6f67; stroke-width: 1; }
    .ghost { fill: none; stroke: #586375; stroke-width: 1; stroke-dasharray: 4 3; }
    .gate { fill: #17202c; }
    .gate-line { stroke: #17202c; stroke-width: 1; stroke-dasharray: 3 3; }
    .axis { stroke: #586375; stroke-width: 1; }
    .rule { stroke: #d6dce5; stroke-width: 1; }
    .arrival { stroke: #17202c; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .dot-ok { fill: #0d6f67; }
    .dot-bad { fill: #b42318; }
  </style>
  <rect x="-20" y="-20" width="800" height="400" fill="#ffffff"/>
          <text class="h" x="470" y="22" text-anchor="middle">결제 B 도착</text>
          <line class="arrival" x1="470" y1="30" x2="470" y2="344"/>

          <text class="h" x="0" y="60">승인 A</text>
          <rect class="box" x="150" y="40" width="180" height="32" rx="4"/>
          <text x="240" y="60" text-anchor="middle">T1 · 검증, 상태 커밋</text>
          <rect class="box" x="330" y="40" width="250" height="32" rx="4"/>
          <text x="455" y="60" text-anchor="middle">토스 승인 호출 · 최대 60초</text>
          <rect class="box" x="580" y="40" width="140" height="32" rx="4"/>
          <text x="650" y="60" text-anchor="middle">T2 · 확정</text>

          <!-- 지금 -->
          <line class="rule" x1="0" y1="90" x2="760" y2="90"/>
          <text class="h" x="0" y="114">지금</text>
          <text class="sm muted" x="0" y="132">락 + 승인 중 확인</text>
          <rect class="lock" x="150" y="100" width="180" height="20" rx="3"/>
          <text class="sm" x="158" y="114">예매 행 락</text>
          <rect class="state" x="330" y="126" width="390" height="20" rx="3"/>
          <text class="sm" x="712" y="140" text-anchor="end">IN_PROGRESS · 다른 요청이 확인</text>
          <circle class="dot-ok" cx="470" cy="136" r="4.5"/>
          <text class="ok" x="482" y="166">B · 즉시 409 PAYMENT_IN_PROGRESS</text>

          <!-- 변형 B -->
          <line class="rule" x1="0" y1="176" x2="760" y2="176"/>
          <text class="h" x="0" y="200">변형 B</text>
          <text class="sm muted" x="0" y="218">승인 중 확인 제거</text>
          <rect class="lock" x="150" y="186" width="180" height="20" rx="3"/>
          <text class="sm" x="158" y="200">예매 행 락</text>
          <rect class="ghost" x="330" y="212" width="390" height="20" rx="3"/>
          <text class="sm muted" x="712" y="226" text-anchor="end">IN_PROGRESS · 기록만 되고 아무도 안 봄</text>
          <circle class="dot-bad" cx="470" cy="222" r="4.5"/>
          <text class="bad" x="482" y="252">B · 토스 두 번 호출 → 이중 결제</text>

          <!-- 8번 변형 -->
          <line class="rule" x1="0" y1="262" x2="760" y2="262"/>
          <text class="h" x="0" y="286">8번 변형</text>
          <text class="sm muted" x="0" y="304">한 트랜잭션으로 묶음</text>
          <rect class="lock" x="150" y="272" width="570" height="20" rx="3"/>
          <text class="sm" x="158" y="286">예매 행 락 · 토스 응답까지 쥠</text>
          <rect class="ghost" x="330" y="298" width="390" height="20" rx="3"/>
          <text class="sm muted" x="712" y="312" text-anchor="end">IN_PROGRESS · 커밋 전이라 안 보임</text>
          <circle class="dot-bad" cx="470" cy="282" r="4.5"/>
          <text class="bad" x="482" y="338">B · 락 대기 3초 → 예외 (409 아님)</text>
        </svg>
