name: cgv

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE를 .env에 설정하세요}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL을 .env에 설정하세요}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:?TOSS_CLIENT_KEY를 .env에 설정하세요}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?TOSS_SECRET_KEY를 .env에 설정하세요}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    mem_limit: ${APP_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--performance-schema=OFF"]
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME을 .env에 설정하세요}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 설정하세요}
    mem_limit: ${DB_MEM_LIMIT:-512m}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # 메트릭(app:8081)과 컨테이너 로그를 수집해 모니터링 서버로 보낸다. 실패해도 서비스에는 영향이 없도록 app과 의존 관계를 두지 않는다
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      MONITORING_HOST: ${MONITORING_HOST:?MONITORING_HOST(모니터링 서버 사설 IP)를 .env에 설정하세요}
      GOMEMLIMIT: ${ALLOY_GOMEMLIMIT:-100MiB}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - alloy-data:/var/lib/alloy/data
    mem_limit: ${ALLOY_MEM_LIMIT:-128m}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql-data:
  alloy-data:
