spring:
  datasource:
    # Connection and temporary credentials are provided only by the test container.
    embedded-database-connection: none
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      # 여러 테스트 컨텍스트가 컨테이너 DB 하나를 공유한다. create-drop이면 @DirtiesContext로 닫히는
      # 컨텍스트가 스키마를 지워 캐시에 남은 다른 컨텍스트의 테스트가 실패하므로 시작할 때만 다시 만든다.
      ddl-auto: create

cgv:
  jwt:
    secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-token-seconds: 1800
