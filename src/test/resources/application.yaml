spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

# 테스트 전용 더미 키. 운영 키와 무관하며 노출되어도 되는 값이다.
jwt:
  secret: Y2d2LXRlc3Qtb25seS1kdW1teS1oczI1Ni1rZXktbm90LWZvci1wcm9kdWN0aW9uISE=
  access-token-validity: 30m

refresh-token:
  validity: 14d

cors:
  allowed-origins: http://localhost:3000

# 접두사 검증만 통과하는 무효 키. 테스트는 토스를 실제로 호출하지 않는다.
toss-payments:
  base-url: https://api.tosspayments.com
  client-key: test_gck_dummy-for-test-only
  secret-key: test_gsk_dummy-for-test-only

# 결과 불명 결제 정리 스케줄러를 끈다. 테스트는 정리 메서드를 직접 부른다(SchedulingConfig).
scheduling:
  enabled: false
