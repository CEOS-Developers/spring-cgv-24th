spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  # Test-only signing key; never use this key outside tests.
  secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  access-token-expiration: 3600000

payment:
  toss:
    # Test-only configuration; gateway calls in payment tests are mocked.
    secret-key: test_gsk_not_a_real_key
    base-url: https://api.tosspayments.com
    recovery:
      # 복구 테스트는 메서드를 직접 호출한다. 자동 실행으로 fixture가 변경되는 것을 방지한다.
      interval: 1h
