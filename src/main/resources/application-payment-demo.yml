spring:
  datasource:
    url: jdbc:h2:mem:payment-demo-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

cgv:
  jwt:
    # 격리된 임시 데모 계정용 키이며 외부 서비스 인증에 사용하지 않는다.
    secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  seat-backfill:
    enabled: false
