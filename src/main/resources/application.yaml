spring:
  application:
    name: spring-cgv

  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

management:
  server:
    # Actuator를 서비스 포트와 분리하고, compose에서 외부에 공개하지 않는다.
    port: 8081
  endpoints:
    web:
      exposure:
        # env, heapdump 등은 비밀값이 노출될 수 있으므로 필요한 것만 연다.
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # p95, p99 계산을 위한 응답 시간 히스토그램
        http.server.requests: true
        # 토스 API 호출 응답 시간 p95 계산용
        http.client.requests: true

jwt:
  secret: ${JWT_SECRET}
  at-validity: 1800000 # 30분
  rt-validity: 1209600000 # 14일

logging:
  pattern:
    # 로그 레벨 옆에 MDC 값(requestId, memberId)을 표시한다.
    level: "%5p [%X{requestId:-}] [%X{memberId:-}]"
  level:
    org.hibernate.sql: debug

payment:
  toss:
    test_client_api_key: ${TOSS_CLIENT_KEY}
    test_secret_api_key: ${TOSS_SECRET_KEY}
    success_url: "${APP_BASE_URL:http://localhost:8080}/api/v1/payments/toss/success"
    failure_url: "${APP_BASE_URL:http://localhost:8080}/api/v1/payments/toss/fail"