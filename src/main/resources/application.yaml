spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug


jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:5s}
    command-read-timeout: ${TOSS_COMMAND_READ_TIMEOUT:60s}
    query-read-timeout: ${TOSS_QUERY_READ_TIMEOUT:5s}
    recovery:
      enabled: ${PAYMENT_RECOVERY_ENABLED:true}
      interval: ${PAYMENT_RECOVERY_INTERVAL:30s}
      processing-timeout: ${PAYMENT_PROCESSING_TIMEOUT:2m}
      retry-delay: ${PAYMENT_RECOVERY_RETRY_DELAY:30s}
      lease-duration: ${PAYMENT_RECOVERY_LEASE_DURATION:30s}
      batch-size: ${PAYMENT_RECOVERY_BATCH_SIZE:100}
