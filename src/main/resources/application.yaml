spring:
  application:
    name: cgv

  config:
    import: "optional:file:./.env[.properties]"

  cache:
    type: ${CACHE_TYPE:none}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/cgv
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha


jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: cgv-api

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    connect-timeout: 5s
    read-timeout: 60s

management:
  health:
    redis:
      enabled: false
  server:
    port: 9091

  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    name: ./logs/cgv.log

  structured:
    format:
      file: logstash
