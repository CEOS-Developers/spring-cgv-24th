spring:
  application:
    name: cgv
  datasource:
    # innodb_lock_wait_timeout: 기본 50초. 좌석 경합으로 막힌 스레드는 커넥션을 쥔 채
    # 기다리므로, 한도가 길면 좌석 하나의 경합이 풀을 말려 무관한 API까지 같이 죽는다.
    # serverTimezone: 드라이버가 시각 값을 변환할 때 쓰는 기준. 생략하면 JVM 기본값을 따르므로 앱의 업무 시간대와 명시적으로 맞춘다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&sessionVariables=innodb_lock_wait_timeout=3
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      # 락 한도보다 길게 두면 풀이 빈 동안 무관한 요청이 경합 중인 요청보다 먼저 죽는다.
      connection-timeout: 3000
  jpa:
    # 컨트롤러·직렬화 구간까지 커넥션을 물지 않는다. 조회는 전부 fetch join 또는
    # DTO 프로젝션이라 지연 로딩이 남아 있지 않다.
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    defer-datasource-initialization: true

# 실제 값은 Git에 올리지 않는 로컬 환경변수(.env)로 주입한다.
# JWT_SECRET: Base64 인코딩, 디코딩 후 256비트 이상 (예: openssl rand -base64 32)
# JWT_ACCESS_TOKEN_VALIDITY: Duration 형식 (예: 30m)
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}

# REFRESH_TOKEN_VALIDITY: Duration 형식 (예: 14d). 액세스 토큰보다 길게 둔다.
refresh-token:
  validity: ${REFRESH_TOKEN_VALIDITY}

# CORS_ALLOWED_ORIGINS: 프런트엔드 출처, 여러 개면 쉼표로 구분. 없으면 로컬 개발 서버만 허용한다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# local 프로필(SPRING_PROFILES_ACTIVE=local)에서만 읽는다. 다른 프로필에서는 값이 없어도 된다.
# 비밀번호 평문은 Git에 올리지 않는 .env로만 주입한다.
admin:
  login-id: ${ADMIN_LOGIN_ID}
  password: ${ADMIN_PASSWORD}

# TOSS_CLIENT_KEY / TOSS_SECRET_KEY: 개발자센터의 "결제위젯 연동 키" 테스트 키(test_gck_ / test_gsk_).
# 시크릿 키는 서버 전용이라 .env로만 주입한다. 클라이언트 키는 노출돼도 되지만 짝을 맞춰 같은 곳에서 관리한다.
toss-payments:
  base-url: https://api.tosspayments.com
  client-key: ${TOSS_CLIENT_KEY}
  secret-key: ${TOSS_SECRET_KEY}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
---
# 결제 테스트 페이지에서 고를 지점·회차·상품을 local 프로필에서만 넣는다. 다른 프로필에는 부팅 부수효과가 없다.
# MySQL은 내장 DB가 아니라 mode: always가 있어야 실행된다. 실행 시점은 위의 defer-datasource-initialization 덕에 테이블 생성 뒤다.
spring:
  config:
    activate:
      on-profile: local
  sql:
    init:
      mode: always
      data-locations: classpath:db/local-sample-data.sql
---
# 배포 서버(EC2 + RDS). 배포마다 앱이 재시작되므로 create로 두면 그때마다 운영 데이터가 지워진다.
# 바인딩 값 로그는 비밀번호 해시·토큰 해시·paymentKey까지 남기므로 운영 로그에서는 끈다.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
