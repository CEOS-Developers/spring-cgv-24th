spring:
  application:
    name: cgv
  datasource:
    # innodb_lock_wait_timeout: 기본 50초. 좌석 경합으로 막힌 스레드는 커넥션을 쥔 채
    # 기다리므로, 한도가 길면 좌석 하나의 경합이 풀을 말려 무관한 API까지 같이 죽는다.
    url: jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&characterEncoding=UTF-8&sessionVariables=innodb_lock_wait_timeout=3
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      # 락 한도보다 길게 두면 풀이 빈 동안 무관한 요청이 경합 중인 요청보다 먼저 죽는다.
      connection-timeout: 3000
  jpa:
    # 컨트롤러·직렬화 구간까지 커넥션을 물지 않는다. 조회는 전부 fetch join 또는
    # DTO 프로젝션이라 지연 로딩이 남아 있지 않다.
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    defer-datasource-initialization: true

# 실제 값은 Git에 올리지 않는 로컬 환경변수(.env)로 주입한다.
# JWT_SECRET: Base64 인코딩, 디코딩 후 256비트 이상 (예: openssl rand -base64 32)
# JWT_ACCESS_TOKEN_VALIDITY: Duration 형식 (예: 30m)
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method