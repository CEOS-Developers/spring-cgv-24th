spring:
  application:
    name: cgv

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: jdbc:mysql://localhost:3306/cgv
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true