name: CI

on:
  push:
    branches:
      - taiho0303-blip
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: 소스 코드 다운로드
        uses: actions/checkout@v7

      - name: Java 21 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Java 테스트 및 빌드
        run: ./gradlew clean build --no-daemon