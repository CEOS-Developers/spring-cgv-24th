name: CI/CD

on:
  pull_request:
  push:
    branches: [chjpooh2002]

permissions:
  contents: read

# PR은 새 커밋이 오면 이전 실행이 의미 없어 취소한다. 배포는 중간에 끊기면 서버가 반쯤 바뀐 상태로 남아 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Windows에서 커밋하면 gradlew의 실행 권한이 빠져 있을 수 있다.
      - run: chmod +x gradlew

      # 동시성 테스트는 Testcontainers로 MySQL을 띄운다. ubuntu 러너에는 Docker가 기본으로 있다.
      - name: 테스트 및 빌드
        run: ./gradlew build

      - name: 실패한 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: 배포용 jar 업로드
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cgv-jar
          path: build/libs/cgv.jar
          retention-days: 1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/chjpooh2002'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: cgv-jar
          path: bundle

      - name: 환경변수 파일 생성
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          JWT_ACCESS_TOKEN_VALIDITY: ${{ vars.JWT_ACCESS_TOKEN_VALIDITY }}
          REFRESH_TOKEN_VALIDITY: ${{ vars.REFRESH_TOKEN_VALIDITY }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          {
            echo "SPRING_PROFILES_ACTIVE=prod"
            echo "DB_HOST=$DB_HOST"
            echo "DB_NAME=$DB_NAME"
            echo "DB_USERNAME=$DB_USERNAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "JWT_ACCESS_TOKEN_VALIDITY=$JWT_ACCESS_TOKEN_VALIDITY"
            echo "REFRESH_TOKEN_VALIDITY=$REFRESH_TOKEN_VALIDITY"
            echo "CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS"
            echo "TOSS_CLIENT_KEY=$TOSS_CLIENT_KEY"
            echo "TOSS_SECRET_KEY=$TOSS_SECRET_KEY"
          } > bundle/cgv.env
          cp deploy/deploy.sh deploy/cgv.service bundle/

      - name: SSH 키 설정
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: EC2에 업로드하고 재시작
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2_key "$TARGET" 'rm -rf ~/cgv-deploy && mkdir -p ~/cgv-deploy'
          scp -i ~/.ssh/ec2_key bundle/* "$TARGET:~/cgv-deploy/"
          ssh -i ~/.ssh/ec2_key "$TARGET" 'bash ~/cgv-deploy/deploy.sh'
