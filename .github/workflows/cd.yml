name: CGV-PROJECT CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Hub secrets
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          : "${DOCKER_HUB_USERNAME:?DOCKER_HUB_USERNAME secret is required}"
          : "${DOCKER_HUB_TOKEN:?DOCKER_HUB_TOKEN secret is required}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build and test with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Build Docker image
        run: docker build --tag "cgv-app:${GITHUB_SHA}" .

      - name: Publish Docker image to Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          # 명령 실패, 미설정 변수 사용, 파이프 중간 실패 시 즉시 중단한다.
          set -euo pipefail

          # GitHub Secret의 아이디로 Docker Hub 저장소 경로를 만든다.
          image="${DOCKER_HUB_USERNAME}/cgv-app"

          # 같은 이미지에 커밋별 버전 태그와 최신 버전 태그를 붙인다.
          docker tag "cgv-app:${GITHUB_SHA}" "${image}:${GITHUB_SHA}"
          docker tag "cgv-app:${GITHUB_SHA}" "${image}:latest"

          # 성공 여부와 관계없이 작업 종료 시 로그아웃한다. 로그아웃 오류는 무시한다.
          trap 'docker logout >/dev/null 2>&1 || true' EXIT

          # 토큰을 명령 인자 대신 표준 입력으로 전달해 Docker Hub에 로그인한다.
          printf '%s' "$DOCKER_HUB_TOKEN" | docker login \
            --username "$DOCKER_HUB_USERNAME" \
            --password-stdin

          # 두 태그의 이미지를 Docker Hub에 업로드한다.
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

      # EC2 준비 후 SSH 접속, 이미지 다운로드, 앱 컨테이너 교체 단계를 추가한다.
      # 앱 교체 후에는 Nginx를 재로드하고 API 응답으로 배포 성공 여부를 확인한다.
