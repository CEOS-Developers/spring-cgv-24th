name: CD

on:
  push:
    branches:
      - alissa159

permissions:
  contents: read

concurrency:
  group: cd-alissa159
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKER_IMAGE }}:${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cgv_test
          MYSQL_USER: cgv_test
          MYSQL_PASSWORD: cgv_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      TZ: Asia/Seoul
      DB_USERNAME: cgv_test
      DB_PASSWORD: cgv_test
    steps:
      - name: 배포 설정 확인
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DOCKERHUB_USERNAME DOCKER_IMAGE DEPLOY_PATH DOCKERHUB_TOKEN EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets/Variables가 비어 있습니다:$missing"
            exit 1
          fi
          invalid=""
          for name in DOCKERHUB_USERNAME DOCKER_IMAGE DEPLOY_PATH EC2_HOST EC2_USERNAME; do
            case "${!name}" in *[[:space:]]*) invalid="$invalid $name" ;; esac
          done
          if [ -n "$invalid" ]; then
            echo "::error::값에 공백 또는 줄바꿈이 들어 있습니다. 앞뒤 공백 없이 다시 입력하세요:$invalid"
            exit 1
          fi
          echo "배포 이미지: $IMAGE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: 테스트 및 JAR 빌드
        run: sh ./gradlew test bootJar --console=plain
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker 이미지 빌드 및 Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          tags: ${{ env.IMAGE }}
          push: true

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SSH 설정
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USERNAME
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
      - name: EC2 배포 및 헬스체크
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          INCOMING_DIR: .incoming-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh ec2 "mkdir -p '$DEPLOY_PATH/$INCOMING_DIR'"
          scp compose.yml deploy/deploy.sh "ec2:$DEPLOY_PATH/$INCOMING_DIR/"
          ssh ec2 "cd '$DEPLOY_PATH' && flock --verbose -w 600 .deploy.lock sh -c 'mv $INCOMING_DIR/compose.yml $INCOMING_DIR/deploy.sh . && rmdir $INCOMING_DIR && bash deploy.sh \"$IMAGE\"'"
      - name: 배포 결과
        if: always()
        run: |
          {
            echo "### CGV 배포 결과: ${{ job.status }}"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo "- 이미지: \`${{ env.IMAGE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
