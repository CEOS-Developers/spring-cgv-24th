name: CI

on:
  pull_request:
    branches:
      - alissa159

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cgv_test
          MYSQL_USER: cgv_test
          MYSQL_PASSWORD: cgv_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      TZ: Asia/Seoul
      DB_USERNAME: cgv_test
      DB_PASSWORD: cgv_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: 테스트 및 JAR 빌드
        run: sh ./gradlew test bootJar --console=plain
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
      - name: Docker 이미지 빌드 검증
        run: docker build -t cgv:ci .
      - name: Docker Compose 설정 검증
        run: |
          docker compose --env-file .env.deploy.example config --quiet
          docker compose --env-file .env.deploy.example config --services | sort | paste -sd, - | grep -qx 'app,db'
