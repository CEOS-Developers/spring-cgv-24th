# Loki 설정: 단일 노드 + 로컬 파일시스템(Docker 볼륨) 저장, 7일 보관
auth_enabled: false # 단일 사용자이므로 멀티테넌시를 끈다.

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7일

# retention_period만으로는 삭제되지 않는다. compactor가 실제로 오래된 로그를 지운다.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# 사용 통계를 Grafana Labs로 보내지 않는다.
analytics:
  reporting_enabled: false
